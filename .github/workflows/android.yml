name: Build check

# Compile check only. Installable APKs come from the private league-data
# repo's Build APK workflow, which builds this code with the data token in
# and signs it with the key installed apps expect. An APK from here would
# have no token and couldn't update those installs, so none is uploaded.

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web assets
        run: |
          npm ci
          npm run sync

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug
